<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Lernstrecke: Soziale Marktwirtschaft &amp; Rente</title>
<style>
:root{
  --accent:#7B2D43; --accent-hover:#65233a; --accent-soft:#f3e4e9; --accent-text:#7B2D43;
  --slate:#2F4A5C; --slate-text:#2F4A5C;
  --bg:#F6F1EA; --surface:#ffffff; --mist:#E6EDF1; --sand2:#efe7db;
  --text:#1c2830; --muted:#566570; --line:#d6dde2;
  --ok:#1d7346; --ok-bg:#e2f3e9; --ok-line:#7cc39b;
  --bad:#ad2a22; --bad-bg:#fbe6e4; --bad-line:#e59a93;
  --warn-bg:#fff7df; --warn-line:#ecd38b; --warn-text:#4e3d07;
  --book-bg:#fff3d6; --book-line:#e0a526; --book-text:#4a3405;
  --shadow:0 1px 2px rgba(20,35,45,.06),0 6px 20px rgba(20,35,45,.08);
  --radius:16px;
  --font:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --accent:#b85674; --accent-hover:#c96986; --accent-soft:#3b2029; --accent-text:#ea9fb6;
    --slate:#1e3342; --slate-text:#cfe0ea;
    --bg:#11181d; --surface:#1b252c; --mist:#22303a; --sand2:#262f35;
    --text:#e8eef1; --muted:#a3b2bc; --line:#33434e;
    --ok:#74d39f; --ok-bg:#163327; --ok-line:#2f7a52;
    --bad:#ff9a90; --bad-bg:#3b1d1a; --bad-line:#8c3a33;
    --warn-bg:#332a10; --warn-line:#6b5a22; --warn-text:#f3e3ae;
    --book-bg:#36290c; --book-line:#a57a1c; --book-text:#f6e2b0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:19px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:0 20px}
h1{font-size:34px;line-height:1.15;margin:0 0 8px;color:var(--slate-text)}
h2{font-size:26px;line-height:1.25;margin:0 0 10px;color:var(--slate-text)}
h3{font-size:21px;line-height:1.3;margin:0 0 8px;color:var(--slate-text)}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:16px}
/* Kopf */
.top{background:#2F4A5C;color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
@media (prefers-color-scheme: dark){.top{background:#1e3342}}
.top .wrap{padding-top:8px;padding-bottom:10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.tbtn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:6px 12px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:16px;font-weight:600;text-decoration:none}
.tbtn svg{width:20px;height:20px}
.top-title{flex:1;text-align:center;font-size:16px;font-weight:600;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:16px;font-weight:700;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;white-space:nowrap}
.tprog{margin-top:8px;display:flex;align-items:center;gap:10px;font-size:15px}
.tbar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.tbar i{display:block;height:100%;background:#f1c9d4;border-radius:99px;transition:width .4s ease}
main{flex:1;padding:22px 0 28px}
.screen{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 22px;margin-bottom:16px}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 22px;border-radius:14px;border:2px solid transparent;font-size:19px;font-weight:700;text-align:center;text-decoration:none;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--text)}
.btn.ghost:hover{border-color:var(--slate-text)}
.btn.full{width:100%}
.btn svg{width:22px;height:22px;flex:none}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.actions .btn{flex:1 1 220px}
/* Start */
.hero{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px;background:var(--mist);position:relative}
.hero img{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}
.hero .cap{position:absolute;right:8px;bottom:6px;font-size:12px;color:#fff;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:6px}
.kicker{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text);margin:0 0 4px}
.rules{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.rules li{display:flex;gap:12px;align-items:center;background:var(--mist);border-radius:12px;padding:10px 14px}
.rules svg{flex:none;width:28px;height:28px;color:var(--slate-text)}
.hp{display:flex;gap:10px;align-items:center;background:var(--warn-bg);border:2px solid var(--warn-line);color:var(--warn-text);border-radius:12px;padding:10px 14px;margin-top:12px;font-size:17px}
.hp svg{flex:none;width:26px;height:26px}
label.lbl{display:block;font-weight:700;margin:16px 0 6px}
.field{width:100%;min-height:56px;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 16px;font-size:20px}
.field:focus{outline:none;border-color:var(--slate-text)}
/* Lernlandkarte */
.map h2{margin-top:6px}
.part{margin:18px 0 8px;font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nodes{list-style:none;margin:0;padding:0;position:relative}
.nodes::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;width:4px;background:var(--line);border-radius:2px}
.node{position:relative;margin:0 0 10px}
.nbtn{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:8px 14px 8px 8px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:left}
.nbtn:disabled{cursor:not-allowed;opacity:.62}
.nnum{position:relative;z-index:1;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--mist);color:var(--slate-text);border:3px solid var(--surface)}
.nnum svg{width:22px;height:22px}
.node.done .nnum{background:var(--ok);color:#fff}
.node.now .nbtn{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.node.now .nnum{background:var(--accent);color:#fff}
.node.cp .nnum{background:#2F4A5C;color:#fff}
.node.cp.done .nnum{background:var(--ok)}
.ntxt{flex:1;min-width:0}
.ntitle{display:block;font-weight:700;font-size:19px;line-height:1.25}
.nmeta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:15px;color:var(--muted);margin-top:2px;align-items:center}
.nmeta svg{width:18px;height:18px;vertical-align:-4px}
.nstate{flex:none;font-size:15px;font-weight:700}
.nstate.ok{color:var(--ok)}
.nstate svg{width:22px;height:22px}
/* Station */
.shead{display:flex;gap:14px;align-items:flex-start}
.sno{flex:none;width:52px;height:52px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800}
.sno.exp{background:#2F4A5C}
.smeta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;background:var(--mist);border-radius:999px;padding:4px 12px}
.tag svg{width:18px;height:18px}
.timer{margin-top:12px}
.timer .tl{display:flex;justify-content:space-between;font-size:15px;color:var(--muted)}
.timer .tb{height:6px;border-radius:99px;background:var(--mist);overflow:hidden;margin-top:4px}
.timer .tb i{display:block;height:100%;width:0;background:var(--slate-text);opacity:.6;border-radius:99px;transition:width 1s linear}
.timer.over .tb i{background:#d39b2a;opacity:1}
.task{display:flex;gap:12px;background:var(--accent-soft);border-left:6px solid var(--accent);border-radius:12px;padding:14px 16px;margin-top:14px}
.task svg{flex:none;width:28px;height:28px;color:var(--accent-text)}
.task b{display:block;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}
.blk{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px;animation:fade .35s ease}
.blk.flat{box-shadow:none;background:transparent;padding:0}
.bh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.bh h3{margin:0}
.btype{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.q{font-size:22px;line-height:1.35;font-weight:700;margin:0 0 14px}
.merk{margin-top:12px;background:var(--accent-soft);border-left:6px solid var(--accent);border-radius:10px;padding:12px 16px}
.merk span{display:block;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}
.merk strong{font-size:20px;line-height:1.4}
.speak{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:6px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:16px;font-weight:600}
.speak svg{width:22px;height:22px}
.speak.on{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft)}
.term{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;border-bottom:2px dotted var(--accent);cursor:help;line-height:inherit}
.pop{position:absolute;z-index:60;max-width:320px;background:#2F4A5C;color:#fff;font-size:17px;line-height:1.4;padding:10px 14px;border-radius:10px;box-shadow:var(--shadow)}
.pop b{display:block;font-size:15px;opacity:.85}
figure{margin:0}
.photo{border-radius:14px;overflow:hidden;background:var(--mist);position:relative}
.photo img{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover}
.photo figcaption{font-size:13px;color:var(--muted);padding:6px 10px;background:var(--surface)}
.illu{background:var(--mist);border-radius:14px;padding:12px;display:grid;place-items:center}
.illu svg{width:100%;max-width:520px;height:auto}
.case{display:flex;gap:14px;background:var(--mist);border-radius:14px;padding:14px 16px}
.case > svg{flex:none;width:44px;height:44px;color:var(--slate-text)}
.case .who{display:block;font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.bubble{position:relative;background:var(--mist);border-radius:18px 18px 18px 4px;padding:14px 16px;font-size:20px;line-height:1.4;max-width:92%}
.bubble.right{margin-left:auto;border-radius:18px 18px 4px 18px;background:var(--accent-soft)}
.bubble .who{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:2px}
.book{display:flex;gap:14px;align-items:center;background:var(--book-bg);border:3px solid var(--book-line);color:var(--book-text);border-radius:14px;padding:14px 16px}
.book svg{flex:none;width:52px;height:52px}
.book b{display:block;font-size:22px;line-height:1.25}
.book span{font-size:18px}
/* Hilfen */
.tips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.tip-b{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:6px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:16px;font-weight:600}
.tip-b svg{width:20px;height:20px}
.tip-b:disabled{opacity:.45;cursor:not-allowed}
.tip-b.used{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-text)}
.hint{display:flex;gap:10px;background:var(--warn-bg);border:2px solid var(--warn-line);color:var(--warn-text);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:18px}
.hint svg{flex:none;width:22px;height:22px;margin-top:3px}
/* Optionen */
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:left;font-size:19px;line-height:1.3;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--slate-text)}
.opt .lt{flex:none;width:32px;height:32px;border-radius:50%;background:var(--mist);display:grid;place-items:center;font-weight:700;font-size:16px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .lt{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .lt{background:var(--bad);color:#fff}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.dim{opacity:.55}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .opt{justify-content:center;font-weight:700;font-size:21px;min-height:64px}
.fb{margin-top:14px;border-radius:12px;padding:12px 16px;border:2px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.fb.neutral{background:var(--mist);border-color:var(--line)}
.fb .fh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px}
.fb.ok .fh{color:var(--ok)}
.fb.bad .fh{color:var(--bad)}
.fb .fh svg{width:24px;height:24px}
.fb p{margin:6px 0 0}
/* Waage */
.scale-wrap{display:grid;gap:12px}
.scale-svg{background:var(--mist);border-radius:14px;padding:8px}
.scale-svg svg{width:100%;height:auto;display:block}
.scale-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pan-list{background:var(--mist);border-radius:12px;padding:10px 14px;min-height:60px}
.pan-list h4{margin:0 0 4px;font-size:17px}
.pan-list ul{margin:0;padding-left:20px;font-size:17px}
#beam{transition:transform .8s cubic-bezier(.3,1.4,.5,1);transform-origin:200px 60px}
/* Karten */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fcard{position:relative;display:block;min-height:200px;border:0;padding:0;background:none;perspective:900px;text-align:left}
.fcard .in{position:relative;display:grid;min-height:200px;height:100%;transition:transform .5s ease;transform-style:preserve-3d}
.fcard.flipped .in{transform:rotateY(180deg)}
.fcard .side{grid-area:1/1;position:relative;border-radius:14px;padding:14px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;gap:6px;border:2px solid var(--line)}
.fcard .front{background:var(--surface);align-items:center;text-align:center}
.fcard .front svg{width:44px;height:44px;color:var(--accent-text)}
.fcard .front b{font-size:20px}
.fcard .front small{font-size:14px;color:var(--muted)}
.fcard .back{background:var(--accent-soft);border-color:var(--accent);transform:rotateY(180deg);font-size:16px;line-height:1.35}
.fcard .back b{font-size:17px;color:var(--accent-text)}
.fcount{font-size:16px;color:var(--muted);margin:10px 0 0}
/* Sortieren */
.cat-now{text-align:center;margin:4px 0 12px}
.cat-now small{display:block;font-size:16px;color:var(--muted);margin-bottom:6px}
.cat-item{display:inline-block;background:#2F4A5C;color:#fff;font-size:23px;font-weight:700;padding:12px 24px;border-radius:14px}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.bin{background:var(--mist);border-radius:12px;padding:10px 12px;min-height:80px}
.bin h4{margin:0 0 6px;font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.bin ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.bin li{font-size:17px;padding:6px 10px;border-radius:8px;background:var(--surface);border-left:5px solid var(--ok)}
.bin li.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.bin li small{display:block;font-size:14px;color:var(--bad)}
/* Lücken */
.gaptext{font-size:21px;line-height:2.3;margin:0 0 14px;background:var(--mist);border-radius:12px;padding:10px 16px}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:120px;min-height:52px;vertical-align:middle;padding:4px 12px;margin:2px;border-radius:10px;border:2px dashed var(--slate-text);background:var(--surface);font-size:19px;font-weight:700;line-height:1.2}
.slot.active{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.slot.filled{border-style:solid}
.slot.ok{border-color:var(--ok);background:var(--ok-bg);border-style:solid}
.slot.bad{border-color:var(--bad);background:var(--bad-bg);border-style:solid}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.word{min-height:52px;padding:8px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:19px;font-weight:600}
.word:disabled{opacity:.3;cursor:default}
.bank-l{font-size:16px;color:var(--muted);margin:0 0 8px}
/* Rechnen */
.slip{border:2px solid var(--line);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums;margin-bottom:14px}
.slip .sh{background:#2F4A5C;color:#fff;padding:8px 14px;font-weight:700;display:flex;justify-content:space-between;font-size:17px}
.slip .row{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-size:18px}
.slip .row b{white-space:nowrap}
.nf{display:grid;gap:10px}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:12px;align-items:center}
.nrow label{font-weight:600}
.nwrap{display:flex;align-items:center;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px}
.nwrap:focus-within{border-color:var(--slate-text)}
.nwrap input{flex:1;min-width:0;border:0;background:transparent;font-size:24px;font-weight:700;min-height:56px;outline:none}
.nwrap span{font-size:20px;font-weight:700;color:var(--muted)}
.nwrap.ok{border-color:var(--ok);background:var(--ok-bg)}
.nwrap.bad{border-color:var(--bad);background:var(--bad-bg)}
.nmsg{font-size:16px;grid-column:1/-1;margin-top:-4px}
.nmsg.ok{color:var(--ok)}.nmsg.bad{color:var(--bad)}
/* Schreiben */
.start{font-weight:700;font-size:20px;margin:0 0 6px}
textarea.ta{width:100%;min-height:120px;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;font-size:19px;line-height:1.45;resize:vertical}
textarea.ta:focus{outline:none;border-color:var(--slate-text)}
textarea.ta[readonly]{background:var(--mist)}
.wc{font-size:16px;color:var(--muted);margin:6px 0 10px}
.wc.okc{color:var(--ok);font-weight:600}
.model{background:var(--ok-bg);border:2px solid var(--ok-line);border-radius:12px;padding:12px 16px;margin-top:12px}
.model b{display:block;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--ok)}
.checks{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.chk{display:flex;gap:12px;align-items:center;min-height:52px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);width:100%;text-align:left;font-size:18px}
.chk .box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center}
.chk .box svg{width:20px;height:20px;opacity:0}
.chk.on{border-color:var(--ok);background:var(--ok-bg)}
.chk.on .box{background:var(--ok);border-color:var(--ok);color:#fff}
.chk.on .box svg{opacity:1}
.terms{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:2px solid var(--line);font-size:16px;font-weight:600}
.tchip svg{width:18px;height:18px}
.tchip.on{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
/* Schaubild */
.flow svg{width:100%;height:auto;display:block}
.flow .bx{fill:var(--surface);stroke:var(--line);stroke-width:2}
.flow .bx.rv{fill:#2F4A5C;stroke:#2F4A5C}
.flow .bx.st{fill:var(--sand2)}
.flow text{font-family:var(--font);fill:var(--text);font-size:15px;font-weight:600}
.flow .rv-t{fill:#fff}
.flow .ar{stroke:var(--muted);stroke-width:3;fill:none;marker-end:url(#ah)}
.flow #ahp{fill:var(--muted)}
.coin{fill:#e0a526;stroke:#a57a1c;stroke-width:1.5}
/* Diagramm */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);fill:var(--text)}
/* Ergebnis Station */
.donebox{background:var(--ok-bg);border:2px solid var(--ok-line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.donebox h3{color:var(--ok)}
/* Checkpoint */
.cpbox{text-align:center}
.bigico{width:84px;height:84px;margin:0 auto 10px;border-radius:22px;background:#2F4A5C;color:#fff;display:grid;place-items:center}
.bigico svg{width:52px;height:52px}
.code{text-transform:uppercase;letter-spacing:.2em;text-align:center;font-size:28px;font-weight:800;max-width:320px;margin:10px auto 0}
.err{color:var(--bad);font-size:17px;min-height:1.5em;margin:8px 0 0}
/* Lernnachweis */
.ptable{width:100%;border-collapse:collapse;font-size:17px}
.ptable th,.ptable td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.ptable td.r,.ptable th.r{text-align:right;white-space:nowrap}
.ptable tr.sum td{font-weight:800;border-bottom:0;font-size:19px}
.rank{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-weight:800;font-size:20px;padding:8px 16px;border-radius:12px}
.rank svg{width:22px;height:22px}
.ptexts{display:grid;gap:10px}
.ptext{border-left:5px solid var(--slate-text);background:var(--mist);border-radius:10px;padding:10px 14px}
.ptext b{display:block;font-size:15px;color:var(--muted)}
.ptext p{margin:4px 0 0;white-space:pre-wrap}
.merks{margin:0;padding-left:24px;display:grid;gap:6px}
.overlay{position:fixed;inset:0;z-index:70;background:#2F4A5C;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:12px}
.overlay .big{font-size:44px;font-weight:800;line-height:1.1}
.overlay .rank{background:#fff;color:#7B2D43;font-size:26px}
.overlay .btn{margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d7346;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;z-index:80;box-shadow:var(--shadow);animation:fade .3s ease;max-width:90vw;text-align:center}
.printonly{display:none}
footer{font-size:14px;color:var(--muted);text-align:center;padding:14px 20px calc(18px + env(safe-area-inset-bottom))}
footer a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid #f1a33b;outline-offset:2px}
@media (max-width:600px){
  body{font-size:18px}
  .wrap{padding:0 16px}
  .panel,.blk{padding:18px 16px}
  h1{font-size:28px}
  .top-title{display:none}
  .nrow{grid-template-columns:1fr}
  .bins,.scale-btns{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media print{
  @page{size:A4;margin:14mm}
  :root{--text:#000;--muted:#444;--line:#bbb;--mist:#f1f1f1;--surface:#fff;--accent-soft:#f7eef1;--slate-text:#2F4A5C}
  body{background:#fff;font-size:11pt;line-height:1.35;color:#000;display:block}
  .top,footer,.noprint,.toast,.overlay,.pop{display:none!important}
  main{padding:0}
  .wrap{max-width:none;padding:0}
  .screen{animation:none}
  .panel,.blk{box-shadow:none;border:1px solid #bbb;padding:10px 12px;margin-bottom:8px;break-inside:avoid}
  .printonly{display:block}
  h1{font-size:18pt;margin:0 0 4px}
  h2{font-size:14pt}
  h3{font-size:12pt}
  .ptable{font-size:10pt}
  .ptable th,.ptable td{padding:3px 6px}
  .ptable tr.sum td{font-size:11pt}
  .rank{font-size:11pt;padding:3px 10px;background:#fff;color:#7B2D43;border:2px solid #7B2D43}
  .rank svg{display:none}
  .ptext{break-inside:avoid;padding:6px 10px;background:#fff;border:1px solid #ccc;border-left:4px solid #2F4A5C}
  .ptext p{font-size:10.5pt}
  .merks{font-size:10.5pt}
}
</style>

const EXPS = ['e1','e2','e3'];

  'So viel Markt wie möglich, so viel Staat wie nötig.',

];

/* ================= Hilfsfunktionen ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => String(s)
  .replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, (m,a,b) => `<button type="button" class="term" data-def="${esc(b)}">${a}</button>`)
  .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
  .replace(/\n/g, '</p><p>');
const plain = s => String(s).replace(/\[\[([^|\]]+)\|[^\]]+\]\]/g, '$1').replace(/\*\*(.+?)\*\*/g, '$1');
const num = n => String(Math.round(n * 10) / 10).replace('.', ',');
const pts = n => num(n) + (n === 1 ? ' Punkt' : ' Punkte');
const words = s => (String(s).trim().match(/[A-Za-zÄÖÜäöüß0-9][A-Za-zÄÖÜäöüß0-9,.'’-]*/g) || []).length;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const range = n => Array.from({length:n}, (_, i) => i);
function parseNum(s){
  s = String(s).replace(/€|\s/g, '');
  if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(',', '.');
  return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : NaN;
}
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= Zustand ================= */
const KEY = 'lernstrecke-smw-rente-v1';
let S = null;
let playerName = '';
let FREE = location.hash === '#frei';
const app = document.getElementById('app');

function fresh(){ return {v:1, done:{}, b:{}, cp:{}, cur:null, perm:{}, started:Date.now()}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load(){ try { const s = localStorage.getItem(KEY); if (!s) return null; const o = JSON.parse(s); return (o && o.v === 1 && o.b) ? o : null; } catch (e) { return null; } }
function clearSave(){ try { localStorage.removeItem(KEY); } catch (e) {} }
const bs = key => (S.b[key] = S.b[key] || {});
function perm(key, n){ if (!S.perm[key]) S.perm[key] = shuffle(range(n)); return S.perm[key]; }

window.LS_DATA = {STATIONS, SEQ, EXPS};
window.LS_STATE = () => S ? JSON.parse(JSON.stringify(S)) : null;

/* Punkte */
function blockMax(b){
  switch (b.t){
    case 'mc': return 2;
    case 'cat': return b.items.length;
    case 'gap': return b.answers.length;
    case 'num': return b.fields.reduce((a, f) => a + f.max, 0);
    case 'write': return b.nopts ? 0 : 2;
    case 'product': return b.terms.length;
    case 'quiz': return b.qs.length * 2;
    default: return 0;
  }
}
function stationMax(st){ return (st.blocks || []).reduce((a, b) => a + blockMax(b), 0); }
function stationPts(st){ return (st.blocks || []).reduce((a, b, i) => a + ((S.b[st.id + ':' + i] || {}).pts || 0), 0); }
function totalPts(){ return SEQ.reduce((a, id) => a + stationPts(BYID[id]), 0); }
const MAXPTS = SEQ.reduce((a, id) => a + stationMax(BYID[id]), 0);
window.LS_DATA.max = MAXPTS;
function rankFor(p){ return p >= 80 ? 'Profi' : p >= 50 ? 'Kenner/-in' : 'Einsteiger/-in'; }

function isDone(id){ return !!S.done[id]; }
function unlocked(id){
  if (EXPS.indexOf(id) >= 0) return isDone('s11');
  const i = SEQ.indexOf(id);
  if (id === 's13') return true;
  for (let k = 0; k < i; k++) if (!isDone(SEQ[k])) return false;
  return true;
}
function nextOpen(){ return SEQ.find(id => !isDone(id) && id !== 's13') || 's13'; }

/* ================= Kopf ================= */
function updateHeader(){
  document.getElementById('score').textContent = S ? pts(totalPts()) : '0 Punkte';
  const inApp = !!S && S.cur !== 'start';
  document.getElementById('mapBtn').hidden = !inApp;
  document.getElementById('homeLink').hidden = inApp;
  const tp = document.getElementById('tprog');
  tp.hidden = !inApp;
  if (inApp){
    const n = SEQ.filter(id => id !== 's13' && isDone(id)).length, all = SEQ.length - 1;
    document.getElementById('tprogText').textContent = `Geschafft: ${n} von ${all}`;
    document.getElementById('tbarFill').style.width = (n / all * 100) + '%';
  }
}

const pop = document.getElementById('pop');
document.addEventListener('click', e => {
  const t = e.target.closest && e.target.closest('.term');
  if (t){
    e.preventDefault();
    pop.innerHTML = '<b>' + esc(t.textContent) + '</b>' + esc(t.getAttribute('data-def'));
    pop.hidden = false;
    const r = t.getBoundingClientRect(), cw = document.documentElement.clientWidth, w = Math.min(320, cw - 24);
    pop.style.maxWidth = w + 'px';
    pop.style.left = Math.max(12, Math.min(r.left + scrollX, scrollX + cw - w - 12)) + 'px';
    pop.style.top = (r.bottom + scrollY + 8) + 'px';

  }
  pop.hidden = true;
}, true);

/* ================= Vorlesen ================= */
const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
function speakBtn(text){ return canSpeak ? `<button class="speak" type="button" data-say="${esc(plain(text).replace(/\n/g, ' '))}">${I.speaker}<span>Vorlesen</span></button>` : ''; }
function stopSpeak(){ if (canSpeak){ try { speechSynthesis.cancel(); } catch (e) {} } document.querySelectorAll('.speak.on').forEach(b => { b.classList.remove('on'); b.querySelector('span').textContent = 'Vorlesen'; }); }
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.speak');
  if (!b) return;
  const wasOn = b.classList.contains('on');
  stopSpeak();
  if (wasOn) return;
  const u = new SpeechSynthesisUtterance(b.getAttribute('data-say'));
  u.lang = 'de-DE'; u.rate = 0.95;
  const v = (speechSynthesis.getVoices() || []).find(v => /^de([-_]|$)/i.test(v.lang));
  if (v) u.voice = v;
  u.onend = u.onerror = () => { b.classList.remove('on'); b.querySelector('span').textContent = 'Vorlesen'; };
  b.classList.add('on'); b.querySelector('span').textContent = 'Stopp';
  speechSynthesis.speak(u);
});

/* ================= Timer ================= */
let timerId = null, tStart = 0;
function startTimer(min){
  clearInterval(timerId);
  tStart = Date.now();
  const tick = () => {
    const el = document.getElementById('timer'); if (!el){ clearInterval(timerId); return; }
    const sec = Math.floor((Date.now() - tStart) / 1000), lim = min * 60;
    const mm = Math.floor(sec / 60), ss = String(sec % 60).padStart(2, '0');
    el.querySelector('.tt').textContent = `${mm}:${ss}`;
    el.querySelector('i').style.width = Math.min(100, sec / lim * 100) + '%';
    if (sec >= lim && !el.classList.contains('over')){ el.classList.add('over'); el.querySelector('.tm').textContent = 'Zeit um – kein Stress, mach in Ruhe fertig.'; }
  };
  tick(); timerId = setInterval(tick, 1000);
}

/* ================= Navigation ================= */
function show(html){
  stopSpeak(); pop.hidden = true; clearInterval(timerId);
  app.innerHTML = '<div class="screen">' + html + '</div>';
  updateHeader();
  scrollTo(0, 0);
}
function go(id){ S.cur = id; save(); route(); }
function route(){
  if (!S || S.cur === 'start' || !S.cur){ renderStart(); return; }
  if (S.cur === 'map'){ renderMap(); return; }
  const st = BYID[S.cur];
  if (!st || !unlocked(st.id)){ S.cur = 'map'; renderMap(); return; }
  if (st.type === 'cp') renderCheckpoint(st);
  else if (st.type === 'proof') renderProof();
  else renderStation(st);
}
document.getElementById('mapBtn').onclick = () => go('map');
addEventListener('hashchange', () => { FREE = location.hash === '#frei'; if (S) route(); });

function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* ================= Lernlandkarte ================= */
function nodeHTML(id){
  const st = BYID[id];
  const done = isDone(id), open = unlocked(id), now = !done && open && (id === nextOpen() || st.exp);
  const cls = ['node', done ? 'done' : '', now ? 'now' : '', st.type === 'cp' ? 'cp' : ''].join(' ');
  const numHTML = done ? I.check : st.type === 'cp' ? I.key : st.type === 'proof' ? I.doc : esc(st.no);
  let meta = '';
  if (st.type === 'cp') meta = `<span>${I.lock} Code von der Tafel</span>`;
  else meta = `<span>${I.clock} ${st.min} Min.</span><span>${st.form === 'pa' ? I.pa + ' Einzel- und Partnerarbeit' : I.ea + ' Einzelarbeit'}</span>` +
    ((st.blocks || []).some(b => b.t === 'book') ? `<span>${I.book} Buch</span>` : '');
  const max = st.blocks ? stationMax(st) : 0;
  const state = done ? `<span class="nstate ok">${max ? num(stationPts(st)) + '/' + max : 'erledigt'}</span>` : !open ? `<span class="nstate">${I.lock}</span>` : `<span class="nstate">${I.arrow}</span>`;
  return `<li class="${cls}"><button class="nbtn" type="button" data-go="${id}" ${open ? '' : 'disabled'} aria-label="${esc(st.title)}${done ? ', erledigt' : open ? '' : ', noch gesperrt'}">
    <span class="nnum">${numHTML}</span><span class="ntxt"><span class="ntitle">${esc(st.title)}</span><span class="nmeta">${meta}</span></span>${state}</button></li>`;
}
function renderMap(){
  const part = (t, ids) => `<p class="part">${t}</p><ol class="nodes">${ids.map(nodeHTML).join('')}</ol>`;
  const expOpen = isDone('s11');
  show(`<section class="panel map"><p class="kicker">Dein Weg heute</p><h2>Lernlandkarte</h2>
    <p class="muted small">Arbeite die Stationen der Reihe nach ab. Erledigte Stationen haben ein Häkchen.</p>

/* ================= Checkpoint ================= */
function renderCheckpoint(st){
  if (isDone(st.id) || FREE){
    if (!isDone(st.id)){ S.done[st.id] = true; save(); }
    show(`<section class="panel cpbox"><div class="bigico">${I.key}</div><h2>${esc(st.title)}</h2>
      <p>${FREE && !S.cp[st.id] ? 'Freier Modus: Dieser Checkpoint ist ausgeschaltet.' : 'Checkpoint geschafft.'}</p>
      <div class="actions"><button class="btn primary full" id="cont" type="button">${I.arrow}Weiter</button></div></section>`);
    document.getElementById('cont').onclick = () => go(nextOpen());
    return;
  }
  show(`<section class="panel cpbox"><div class="bigico">${I.lock}</div><p class="kicker">Lehrer-Checkpoint</p><h2>${esc(st.title)}</h2>
    <p>Super, ${st.id === 'cp1' ? 'Teil 1' : 'Teil 2'} ist geschafft! Melde dich leise bei deiner Lehrkraft.</p>
    <p>Gib dann den <strong>Code von der Tafel</strong> ein.</p>
    <input class="field code" id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" aria-label="Code">
    <p class="err" id="err" aria-live="polite"></p>
    <div class="actions"><button class="btn primary full" id="ok" type="button">${I.key}Code prüfen</button></div></section>`);
  const inp = document.getElementById('code');
  const check = () => {
    if (inp.value.trim().toUpperCase() === st.code){
      S.done[st.id] = true; S.cp[st.id] = true; save(); toast(st.title + ' geschafft!'); go(nextOpen());
    } else document.getElementById('err').textContent = 'Der Code stimmt nicht. Schau noch einmal an die Tafel.';
  };
  document.getElementById('ok').onclick = check;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); check(); } });
}

/* ================= Station ================= */
let curSt = null, nextIdx = 0;
function renderStation(st){
  curSt = st;
  show(`<section class="panel"><div class="shead"><div class="sno${st.exp ? ' exp' : ''}">${esc(st.no)}</div><div>
      <p class="kicker">${st.exp ? 'Expertenstation' : st.part === 1 ? 'Teil 1 · Soziale Marktwirtschaft' : st.part === 2 ? 'Teil 2 · Rente' : 'Abschluss'}</p>
      <h2 style="margin:0">${esc(st.title)}</h2>
      <div class="smeta"><span class="tag">${st.form === 'pa' ? I.pa + 'Einzel-, dann Partnerarbeit' : I.ea + 'Einzelarbeit'}</span><span class="tag">${I.clock}${st.min} Min.</span>${(st.blocks || []).some(b => b.t === 'book') ? `<span class="tag">${I.book}Buch</span>` : ''}</div></div></div>
      <div class="timer" id="timer"><div class="tl"><span class="tm">Empfohlene Zeit: ${st.min} Min.</span><span class="tt">0:00</span></div><div class="tb"><i></i></div></div>
      <div class="task">${I.task}<div><b>Dein Auftrag</b>${esc(st.task)}</div></div></section>
    <div id="blocks"></div><div id="sfoot"></div>`);
  startTimer(st.min);
  nextIdx = 0;
  continueBlocks(false);
}
function continueBlocks(scroll){
  const st = curSt, host = document.getElementById('blocks');
  if (!host) return;
  let firstNew = null;
  while (nextIdx < st.blocks.length){
    const i = nextIdx, b = st.blocks[i], key = st.id + ':' + i;
    const el = document.createElement('div');
    el.className = 'blk'; el.setAttribute('data-key', key); el.setAttribute('data-t', b.t);
    host.appendChild(el);
    if (!firstNew) firstNew = el;
    R[b.t](b, key, el, bs(key));
    nextIdx++;
    if (isRequired(b) && !bs(key).done) break;
  }
  if (nextIdx >= st.blocks.length && st.blocks.every((b, i) => !isRequired(b) || bs(st.id + ':' + i).done)) renderFoot();
  if (scroll && firstNew) setTimeout(() => { try { firstNew.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'}); } catch (e) {} }, 60);
}
const NOT_REQ = ['info','svg','photo','case','speech','book','bars','guessReveal','procon'];
const isRequired = b => NOT_REQ.indexOf(b.t) < 0;
function blockDone(key, data){
  Object.assign(bs(key), data || {}, {done:true});
  save(); updateHeader();
  continueBlocks(true);
}
function renderFoot(){
  const st = curSt, f = document.getElementById('sfoot');
  if (!f || f.innerHTML) return;
  const max = stationMax(st), p = stationPts(st);
  const idx = SEQ.indexOf(st.id);
  f.innerHTML = `<div class="donebox" id="doneBox"><h3>${isDone(st.id) ? 'Station erledigt' : 'Alles bearbeitet!'}</h3>
    ${max ? `<p>Du hast <strong>${num(p)} von ${max} Punkten</strong> in dieser Station.</p>` : '<p>Gut gemacht.</p>'}
    <div class="actions"><button class="btn primary" id="finish" type="button">${I.check}${isDone(st.id) ? 'Weiter' : 'Station abschließen'}</button><button class="btn ghost" id="toMap" type="button">Zur Lernlandkarte</button></div></div>`;
  document.getElementById('finish').onclick = () => {
    const first = !isDone(st.id);
    S.done[st.id] = true; save();
    if (first) toast(`Station ${st.no} geschafft!`);
    if (st.exp) go('map'); else go(idx >= 0 && idx < SEQ.length - 1 ? nextOpen() : 'map');
  };
  document.getElementById('toMap').onclick = () => { if (!isDone(st.id)){ S.done[st.id] = true; save(); toast(`Station ${st.no} geschafft!`); } go('map'); };
}

/* ---------- Hilfen ---------- */
function tipsHTML(tips, used){
  if (!tips) return '';
  return `<div class="tips">
    <button class="tip-b${used >= 1 ? ' used' : ''}" type="button" data-tip="1" ${used >= 1 ? 'disabled' : ''}>${I.bulb}Tipp 1: Hinweis</button>
    <button class="tip-b${used >= 2 ? ' used' : ''}" type="button" data-tip="2" ${used >= 2 || used < 1 ? 'disabled' : ''}>${I.ex}Tipp 2: Beispiel</button></div>
    <div class="hint" data-h="1" ${used >= 1 ? '' : 'hidden'}>${I.bulb}<span>${fmt(tips[0])}</span></div>
    <div class="hint" data-h="2" ${used >= 2 ? '' : 'hidden'}>${I.ex}<span>${fmt(tips[1])}</span></div>`;
}
function wireTips(el, st){
  el.querySelectorAll('[data-tip]').forEach(b => b.onclick = () => {
    const n = +b.getAttribute('data-tip');
    st.tips = Math.max(st.tips || 0, n); save();
    b.disabled = true; b.classList.add('used');
    el.querySelector(`[data-h="${n}"]`).hidden = false;
    if (n === 1){ const b2 = el.querySelector('[data-tip="2"]'); if (b2) b2.disabled = false; }
  });
}
function fbHTML(ok, title, text){ return `<div class="fb ${ok === null ? 'neutral' : ok ? 'ok' : 'bad'}"><div class="fh">${ok === null ? '' : ok ? I.ok : I.bad}${title}</div>${text ? `<p>${text}</p>` : ''}</div>`; }

R.mc = (b, key, el, st) => {

      });
    }
  };
  draw();
};

function insertAt(ta, text){
  const s = ta.selectionStart != null ? ta.selectionStart : ta.value.length, e = ta.selectionEnd != null ? ta.selectionEnd : ta.value.length;
  const before = ta.value.slice(0, s), after = ta.value.slice(e);
  const pre = before && !/\s$/.test(before) ? ' ' : '';
  ta.value = before + pre + text + (/^\s/.test(after) || /\s$/.test(text) ? '' : ' ') + after;
  const pos = (before + pre + text).length + 1;
  try { ta.setSelectionRange(pos, pos); } catch (e2) {}
  ta.dispatchEvent(new Event('input'));
}
R.choose = (b, key, el, st) => {
  el.innerHTML = `<p class="btype">Urteilen</p><p class="q">${esc(b.q)}</p><div class="opts">` +
    b.cards.map((c, i) => `<button class="opt${st.choice === i ? ' sel' : ''}" type="button" data-i="${i}" ${st.done ? 'disabled' : ''}><span class="lt">${'ABCD'[i]}</span><span><strong>${esc(c.t)}</strong><br><span class="small muted">Nachteil: ${esc(c.n)}</span></span></button>`).join('') + '</div>';
  el.querySelectorAll('.opt').forEach(o => o.onclick = () => {
    if (bs(key).done) return;
    const i = +o.getAttribute('data-i');
    el.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.toggle('sel', x === o); });
    blockDone(key, {choice:i});
  });
};
R.partner = (b, key, el, st) => {
  el.innerHTML = `<p class="btype">Partnerarbeit</p><div class="case">${I.pa}<div><span class="who">Mit deinem Sitznachbarn</span>${esc(b.text)}</div></div>
    <div class="actions"><button class="chk${st.done ? ' on' : ''}" id="pok" type="button" ${st.done ? 'disabled' : ''}><span class="box">${I.check}</span><span>Wir haben verglichen.</span></button></div>`;
  el.querySelector('#pok').onclick = () => { if (bs(key).done) return; el.querySelector('#pok').classList.add('on'); blockDone(key); };
};
R.procon = (b, key, el) => {
  el.innerHTML = `<p class="btype">Pro und Contra</p><div class="bins"><div class="bin"><h4>Pro: dafür</h4><ul>${b.pro.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div><div class="bin"><h4>Contra: dagegen</h4><ul>${b.con.map(x => `<li style="border-left-color:var(--accent)">${esc(x)}</li>`).join('')}</ul></div></div>`;
};
R.product = (b, key, el, st) => {
  el.innerHTML = `<p class="btype">Dein Produkt: Sprachnachricht</p><p class="q">Schreib Herrn Kayas Antwort an Lina (3 bis 5 Sätze).</p>${st.done ? '' : tipsHTML(b.tips, st.tips || 0)}
    <p class="bank-l">Pflichtbegriffe:</p><div class="terms">${b.terms.map((t, i) => `<span class="tchip" data-term="${i}">${I.check}${esc(t.t)}</span>`).join('')}</div>
    <textarea class="ta" style="min-height:170px" aria-label="Sprachnachricht von Herrn Kaya" placeholder="Hallo Lina, …"></textarea>
    <p class="wc"></p>
    <p class="bank-l">Satzbausteine – tippe an, um sie einzufügen:</p><div class="bank">${b.parts.map(p => `<button class="word" type="button" data-ins="${esc(p)}">${esc(p.trim())}</button>`).join('')}</div>
    <div class="actions"><button class="btn primary" id="pdone" type="button">${I.check}Nachricht fertig</button></div><div id="pres"></div>`;
  const ta = el.querySelector('textarea'), wc = el.querySelector('.wc'), btn = el.querySelector('#pdone');
  ta.value = st.text || '';
  if (!st.done) wireTips(el, st);
  const sentences = v => (v.match(/[^.!?]*[A-Za-zÄÖÜäöüß][^.!?]*[.!?]/g) || []).length;
  const upd = () => {
    const v = ta.value, hits = b.terms.map(t => t.re.test(v)), n = sentences(v);
    el.querySelectorAll('[data-term]').forEach((c, i) => c.classList.toggle('on', hits[i]));
    const okAll = hits.every(Boolean) && n >= 3;
    wc.textContent = `${n} ${n === 1 ? 'Satz' : 'Sätze'} (3 bis 5) · ${hits.filter(Boolean).length} von ${b.terms.length} Pflichtbegriffen` + (n > 5 ? ' · Tipp: Kürzer ist besser.' : '');
    wc.classList.toggle('okc', okAll);
    btn.disabled = !okAll || !!bs(key).done;
  };
  ta.addEventListener('input', () => { bs(key).text = ta.value; save(); upd(); });
  el.querySelectorAll('[data-ins]').forEach(w => w.onclick = () => insertAt(ta, w.getAttribute('data-ins').trim()));
  const res = () => { el.querySelector('#pres').innerHTML = fbHTML(true, `Fertig! +${pts(bs(key).pts || 0)}`, '') + `<div class="model"><b>So könnte eine Antwort aussehen</b>${esc(b.model)}</div>`; };
  btn.onclick = () => { const v = ta.value; const p = b.terms.filter(t => t.re.test(v)).length; bs(key).text = v; res0(p); };
  const res0 = p => { blockDone(key, {pts:p}); res(); btn.disabled = true; };
  if (st.done) res();
  upd();
};
R.quiz = (b, key, el, st) => {
  st.a = st.a || [];
  const draw = () => {
    const s = bs(key), i = s.a.length;
    if (i >= b.qs.length){
      const p = s.a.reduce((x, y) => x + y.pts, 0);
      el.innerHTML = `<p class="btype">Abschlussquiz</p><h3>Quiz geschafft!</h3>` + fbHTML(p >= b.qs.length * 2 * .5, `${p} von ${b.qs.length * 2} Punkten`, s.a.map((r, k) => `${k + 1}: ${r.ok ? 'richtig' : 'falsch'}${r.tip ? ' (Tipp)' : ''}`).join(' · '));
      return;
    }
    const q = b.qs[i], order = q.k === 'mc' ? perm(key + ':' + i, q.opts.length) : null;
    el.innerHTML = `<p class="btype">Abschlussquiz · Frage ${i + 1} von ${b.qs.length}</p>
      <div class="tips"><button class="tip-b${s.tip ? ' used' : ''}" type="button" id="qtip" ${s.tip ? 'disabled' : ''}>${I.bulb}Tipp (−1 Punkt)</button></div>
      <div class="hint" id="qhint" ${s.tip ? '' : 'hidden'}>${I.bulb}<span>${esc(q.tip)}</span></div>` +
      (q.k === 'tf' ? `<p class="q">Richtig oder falsch?</p><div class="case" style="margin-bottom:12px;font-weight:600">${esc(q.q)}</div><div class="two"><button class="opt" type="button" data-v="1">Richtig</button><button class="opt" type="button" data-v="0">Falsch</button></div>`
       : q.k === 'num' ? `<p class="q">${esc(q.q)}</p><div class="nrow"><div class="nwrap" id="qw"><input id="qnum" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Deine Antwort">${q.unit ? `<span>${esc(q.unit)}</span>` : ''}</div><button class="btn primary" id="qchk" type="button">Prüfen</button></div><p class="err" id="qerr"></p>`
       : `<p class="q">${esc(q.q)}</p><div class="opts">${order.map((oi, k) => `<button class="opt" type="button" data-i="${oi}"><span class="lt">${'ABCD'[k]}</span><span>${esc(q.opts[oi])}</span></button>`).join('')}</div>`) +
      `<div id="qfb"></div>`;
    el.querySelector('#qtip').onclick = () => { bs(key).tip = true; save(); el.querySelector('#qtip').disabled = true; el.querySelector('#qtip').classList.add('used'); el.querySelector('#qhint').hidden = false; };
    let answered = false;
    const finish = (ok, mark) => {
      if (answered) return; answered = true;
      const s2 = bs(key), p = ok ? (s2.tip ? 1 : 2) : 0;
      s2.a.push({ok, tip:!!s2.tip, pts:p}); s2.tip = false; s2.pts = s2.a.reduce((x, y) => x + y.pts, 0); save(); updateHeader();
      el.querySelector('#qtip').disabled = true;
      if (mark) mark();
      el.querySelector('#qfb').innerHTML = fbHTML(ok, ok ? `Richtig! +${pts(p)}` : 'Leider falsch.', esc(q.exp)) + `<div class="actions"><button class="btn primary full" id="qnext" type="button">${i + 1 < b.qs.length ? 'Nächste Frage' : 'Quiz beenden'}${I.arrow}</button></div>`;
      el.querySelector('#qnext').onclick = () => { if (bs(key).a.length >= b.qs.length){ draw(); blockDone(key); } else { draw(); el.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'}); } };
      setTimeout(() => { const n = el.querySelector('#qnext'); if (n) try { n.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'nearest'}); } catch (e) {} }, 40);
    };
    if (q.k === 'tf') el.querySelectorAll('[data-v]').forEach(o => o.onclick = () => {
      const v = o.getAttribute('data-v') === '1';
      finish(v === q.a, () => el.querySelectorAll('[data-v]').forEach(x => { x.disabled = true; x.classList.add((x.getAttribute('data-v') === '1') === q.a ? 'ok' : 'bad'); }));
    });
    else if (q.k === 'num'){
      const inp = el.querySelector('#qnum');
      const chk = () => { const v = parseNum(inp.value); if (isNaN(v)){ el.querySelector('#qerr').textContent = 'Bitte gib eine Zahl ein.'; return; } el.querySelector('#qerr').textContent = '';
        const ok = Math.abs(v - q.a) < 0.005; finish(ok, () => { inp.readOnly = true; el.querySelector('#qw').classList.add(ok ? 'ok' : 'bad'); el.querySelector('#qchk').disabled = true; if (!ok) el.querySelector('#qerr').textContent = 'Richtig ist: ' + num(q.a) + ' ' + (q.unit || ''); }); };
      el.querySelector('#qchk').onclick = chk; inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); chk(); } });
    }
    else el.querySelectorAll('[data-i]').forEach(o => o.onclick = () => {
      const oi = +o.getAttribute('data-i');
      finish(oi === q.c, () => el.querySelectorAll('[data-i]').forEach(x => { x.disabled = true; const xi = +x.getAttribute('data-i'); x.classList.add(xi === q.c ? 'ok' : x === o ? 'bad' : 'dim'); }));
    });
  };
  draw();
};

/* ================= Lernnachweis ================= */
function proofTexts(){
  const out = [];
  PROOF_TEXT_STATIONS.forEach(id => {
    const st = BYID[id];
    st.blocks.forEach((b, i) => {
      const s = S.b[id + ':' + i];
      if ((b.t === 'write' || b.t === 'product') && s && s.text && s.text.trim()){
        out.push({label:b.label, text:(b.t === 'write' ? startText(b).replace(/\s*…$/, '') + ' ' : '') + s.text.trim()});
      }
    });
  });
  return out;
}
function renderProof(){
  if (isDone('s12') && !isDone('s13')){ S.done.s13 = true; save(); }
  const total = totalPts(), p = Math.round(total / MAXPTS * 100), rank = rankFor(p);
  const d = new Date().toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'});
  const rows = SEQ.filter(id => BYID[id].type !== 'cp' && id !== 's13').map(id => {
    const st = BYID[id], m = stationMax(st);
    return `<tr><td>${esc(st.no)}. ${esc(st.title)}</td><td class="r">${isDone(id) ? 'erledigt' : '–'}</td><td class="r">${m ? num(stationPts(st)) + ' / ' + m : '–'}</td></tr>`;
  }).join('');
  const exps = EXPS.filter(isDone).map(id => BYID[id].title.replace('Experte: ', '')).join(', ');
  const cps = ['cp1','cp2'].map(id => `${BYID[id].title}: ${isDone(id) ? (S.cp[id] ? 'bestätigt' : 'freier Modus') : 'offen'}`).join(' · ');
  const texts = proofTexts();
  show(`<section class="panel" id="proof">
    <p class="kicker">Lernnachweis · Wirtschaft-Politik · Klasse 10</p>
    <h1>Markt mit Herz – und wer zahlt deine Rente?</h1>
    <div class="noprint"><label class="lbl" for="pname">Name</label><input class="field" id="pname" type="text" autocomplete="off" maxlength="40" value="${esc(playerName)}" placeholder="Dein Vorname"></div>
    <p style="margin-top:10px"><strong>Name:</strong> <span id="pnameOut">${esc(playerName) || '______________________'}</span> &nbsp;·&nbsp; <strong>Datum:</strong> ${d}</p>
    <p class="small muted">${esc(cps)}</p>
    <h3 style="margin-top:12px">Punkte je Station</h3>
    <table class="ptable"><thead><tr><th>Station</th><th class="r">Status</th><th class="r">Punkte</th></tr></thead><tbody>${rows}
      <tr class="sum"><td>Gesamt</td><td class="r">${p} %</td><td class="r" id="ptotal">${num(total)} / ${MAXPTS}</td></tr></tbody></table>
    <p style="margin-top:12px"><span class="rank" id="prank">${I.star}${rank}</span></p>
    ${exps ? `<p><strong>Expertenstationen:</strong> ${esc(exps)}</p>` : ''}
    <h3 style="margin-top:14px">Meine Texte</h3>
    <div class="ptexts">${texts.length ? texts.map(t => `<div class="ptext"><b>${esc(t.label)}</b><p>${esc(t.text)}</p></div>`).join('') : '<p class="muted">Noch keine Texte.</p>'}</div>
    <h3 style="margin-top:14px">Die 5 wichtigsten Merksätze</h3>
    <ol class="merks">${MERKS.map(m => `<li>${esc(m)}</li>`).join('')}</ol>
    </section>
    <section class="panel noprint">
      ${isDone('s12') ? '' : '<p class="muted">Du bist noch nicht fertig. Das ist dein Zwischenstand.</p>'}
      <div class="actions" style="margin-top:0"><button class="btn primary" id="pprint" type="button">${I.print}Als PDF sichern</button><button class="btn ghost" id="pshow" type="button">${I.eye}Zeig diesen Bildschirm deiner Lehrkraft</button></div>
      <p class="small muted" style="margin-top:10px">Auf dem iPad: Im Druckfenster auf <strong>Teilen</strong> tippen → <strong>In Dateien sichern</strong> oder per <strong>AirDrop</strong> an deine Lehrkraft.</p>
      <div class="actions"><button class="btn ghost" id="pmap" type="button">Zur Lernlandkarte</button></div>
    </section>`);
  const pn = document.getElementById('pname');
  pn.addEventListener('input', () => { playerName = pn.value.trim(); document.getElementById('pnameOut').textContent = playerName || '______________________'; });
  document.getElementById('pprint').onclick = () => window.print();
  document.getElementById('pmap').onclick = () => go('map');
  document.getElementById('pshow').onclick = () => {
    const o = document.createElement('div'); o.className = 'overlay'; o.id = 'teacher';
    o.innerHTML = `<p class="kicker" style="color:#f1c9d4">Für die Lehrkraft</p><div class="big">${esc(playerName || 'Ohne Namen')}</div>
      <div style="font-size:24px">${num(total)} von ${MAXPTS} Punkten · ${p} %</div><span class="rank">${rank}</span>
      <div style="font-size:20px">${SEQ.filter(id => id !== 's13' && isDone(id)).length} von ${SEQ.length - 1} Stationen erledigt${exps ? ' · Experte: ' + esc(exps) : ''}</div>
      <button class="btn ghost" type="button" id="oclose">Schließen</button>`;
    document.body.appendChild(o);
    o.querySelector('#oclose').onclick = () => o.remove();
  };
}

/* ================= Start ================= */
S = null;
renderStart();
})();
