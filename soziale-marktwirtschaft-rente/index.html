<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Quiz: Soziale Marktwirtschaft &amp; Rente</title>
<style>
:root{
  --accent:#7B2D43; --accent-hover:#65233a; --accent-soft:#f3e4e9; --on-accent:#ffffff;
  --slate:#2F4A5C; --slate-ink:#ffffff; --slate-soft:#dbe4ea;
  --bg:#F6F1EA; --surface:#ffffff; --mist:#E6EDF1;
  --text:#1c2830; --muted:#566570; --line:#d6dde2; --rule:#dfe8ee;
  --ok:#1d7346; --ok-bg:#e2f3e9; --ok-line:#7cc39b;
  --bad:#ad2a22; --bad-bg:#fbe6e4; --bad-line:#e59a93;
  --merk-bg:#f3e4e9; --merk-line:#7B2D43;
  --shadow:0 1px 2px rgba(20,35,45,.06),0 6px 20px rgba(20,35,45,.08);
  --radius:16px;
  --font:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --accent:#b85674; --accent-hover:#c96986; --accent-soft:#3b2029; --on-accent:#ffffff;
    --slate:#1e3342; --slate-ink:#eef3f6; --slate-soft:#2a4252;
    --bg:#11181d; --surface:#1b252c; --mist:#22303a;
    --text:#e8eef1; --muted:#a3b2bc; --line:#33434e; --rule:#26343d;
    --ok:#74d39f; --ok-bg:#163327; --ok-line:#2f7a52;
    --bad:#ff9a90; --bad-bg:#3b1d1a; --bad-line:#8c3a33;
    --merk-bg:#35202a; --merk-line:#c96986;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:19px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
a{color:inherit}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:0 20px}
/* Kopfleiste */
.top{background:var(--slate);color:var(--slate-ink);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.top .wrap{padding-top:10px;padding-bottom:12px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:16px;text-decoration:none;opacity:.9;padding:8px 10px 8px 0;min-height:44px}
.back:hover{opacity:1;text-decoration:underline}
.top-title{font-size:16px;font-weight:600;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:center}
.score{font-size:17px;font-weight:700;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;white-space:nowrap}
.prog{margin-top:8px}
.prog-meta{display:flex;justify-content:space-between;align-items:center;font-size:16px;gap:10px;min-height:28px}
.prog-meta b{font-weight:700}
.segs{display:flex;gap:6px;margin-top:6px}
.seg{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:#f1c9d4;border-radius:99px;transition:width .35s ease}
.streak{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;background:#f1c9d4;color:#4a1626;padding:3px 10px;border-radius:999px}
.streak.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.streak svg{width:16px;height:16px}
/* Hauptbereich */
main{flex:1;padding:24px 0 28px}
.screen{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 24px}
h1{font-size:34px;line-height:1.15;margin:0 0 8px;color:var(--slate)}
h2{font-size:26px;line-height:1.25;margin:0 0 12px;color:var(--slate)}
@media (prefers-color-scheme: dark){h1,h2{color:#cfe0ea}}
.sub{font-size:21px;color:var(--muted);margin:0 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 24px;border-radius:14px;border:2px solid transparent;font-size:19px;font-weight:700;text-align:center;transition:background .15s,transform .1s,border-color .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--text)}
.btn.ghost:hover{border-color:var(--slate)}
.btn.full{width:100%}
.btn svg{width:22px;height:22px;flex:none}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.actions .btn{flex:1 1 220px}
/* Start */
.hero{display:flex;gap:18px;align-items:center;margin-bottom:6px}
.hero-ico{flex:none;width:84px;height:84px;border-radius:22px;background:var(--accent);color:#fff;display:grid;place-items:center}
.hero-ico svg{width:54px;height:54px}
.info{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 22px}
.chip{background:var(--mist);border-radius:999px;padding:6px 14px;font-size:17px}
.rounds{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:8px}
.rounds li{display:flex;align-items:center;gap:14px;background:var(--mist);border-radius:12px;padding:10px 14px;font-size:18px}
.rounds .ri{flex:none;width:40px;height:40px;border-radius:10px;background:var(--surface);color:var(--slate);display:grid;place-items:center}
@media (prefers-color-scheme: dark){.rounds .ri{color:#cfe0ea}}
.rounds .ri svg{width:28px;height:28px}
.rounds .rn{font-weight:700;color:var(--accent);margin-right:4px}
@media (prefers-color-scheme: dark){.rounds .rn{color:#e59ab0}}
label.lbl{display:block;font-weight:700;margin-bottom:6px}
.field{width:100%;min-height:56px;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 16px;font-size:20px}
.field:focus{outline:none;border-color:var(--slate)}
.note{font-size:16px;color:var(--muted);margin:6px 0 0}
/* Karteikarte */
.icard{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border-top:8px solid var(--accent)}
.icard-head{display:flex;align-items:center;gap:16px;padding:20px 24px 14px;border-bottom:2px solid var(--accent)}
.icard-ico{flex:none;width:60px;height:60px;border-radius:14px;background:var(--mist);color:var(--slate);display:grid;place-items:center}
@media (prefers-color-scheme: dark){.icard-ico{color:#cfe0ea}}
.icard-ico svg{width:40px;height:40px}
.kicker{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 2px}
@media (prefers-color-scheme: dark){.kicker{color:#e59ab0}}
.icard-head h2{margin:0;font-size:24px}
.icard-body{padding:4px 24px 22px}
.icard ul{margin:0;padding:0 0 0 22px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,var(--rule) 33px,var(--rule) 34px);background-position:0 0;line-height:34px;font-size:19px}
.icard li{margin:0;padding:0}
.icard li::marker{color:var(--accent)}
.merk{margin-top:16px;background:var(--merk-bg);border-left:6px solid var(--merk-line);border-radius:10px;padding:14px 16px}
.merk .mk{display:block;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
@media (prefers-color-scheme: dark){.merk .mk{color:#e59ab0}}
.merk strong{font-size:20px;line-height:1.4}
.src{font-size:15px;color:var(--muted);margin:10px 0 0}
/* Glossar */
.term{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;border-bottom:2px dotted var(--accent);cursor:help;line-height:inherit}
.pop{position:absolute;z-index:60;max-width:320px;background:var(--slate);color:#fff;font-size:17px;line-height:1.4;padding:10px 14px;border-radius:10px;box-shadow:var(--shadow)}
.pop b{display:block;font-size:15px;opacity:.85}
/* Frage */
.qhead{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
.qtype{font-size:15px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:17px;font-weight:600}
.tool svg{width:20px;height:20px}
.tool:disabled{opacity:.45;cursor:not-allowed}
.tool.used{border-color:var(--accent);color:var(--accent)}
@media (prefers-color-scheme: dark){.tool.used{color:#e59ab0}}
.qtext{font-size:24px;line-height:1.35;font-weight:700;margin:0 0 18px}
.case{display:flex;gap:14px;background:var(--mist);border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:20px}
.case svg{flex:none;width:36px;height:36px;color:var(--slate)}
@media (prefers-color-scheme: dark){.case svg{color:#cfe0ea}}
.case b{display:block;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.statement{background:var(--mist);border-left:6px solid var(--slate);border-radius:10px;padding:16px 18px;font-size:22px;line-height:1.4;font-weight:600;margin:0 0 18px}
.hint{display:flex;gap:12px;background:#fff7df;border:2px solid #ecd38b;color:#4e3d07;border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:18px}
@media (prefers-color-scheme: dark){.hint{background:#332a10;border-color:#6b5a22;color:#f3e3ae}}
.hint svg{flex:none;width:24px;height:24px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:left;font-size:20px;line-height:1.3;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--slate)}
.opt .lt{flex:none;width:34px;height:34px;border-radius:50%;background:var(--mist);display:grid;place-items:center;font-weight:700;font-size:17px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .lt{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .lt{background:var(--bad);color:#fff}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.dim{opacity:.55}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{justify-content:center;font-weight:700;font-size:22px;min-height:68px}
/* Kategorien */
.cat-now{text-align:center;margin:4px 0 14px}
.cat-now small{display:block;font-size:16px;color:var(--muted);margin-bottom:6px}
.cat-item{display:inline-block;background:var(--slate);color:#fff;font-size:24px;font-weight:700;padding:14px 26px;border-radius:14px;animation:fade .25s ease}
.cat-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.cat-btns .opt{justify-content:center;font-weight:700;font-size:21px;min-height:68px}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bin{background:var(--mist);border-radius:12px;padding:10px 12px;min-height:90px}
.bin h4{margin:0 0 6px;font-size:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.bin ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.bin li{font-size:17px;padding:6px 10px;border-radius:8px;background:var(--surface);border-left:5px solid var(--ok)}
.bin li.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.bin li small{display:block;font-size:14px;color:var(--bad)}
/* Zuordnen */
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px}
.mcol{display:grid;gap:10px;align-content:start}
.mcol h4{margin:0;font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.mi{position:relative;min-height:64px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);text-align:left;font-size:18px;line-height:1.3}
.mi.left{font-weight:700}
.mi.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.mi.done{border-color:var(--ok);background:var(--ok-bg);cursor:default;padding-right:44px}
.mi.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .4s}
.mi .pn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--ok);color:#fff;font-size:15px;font-weight:700;display:grid;place-items:center}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mstat{font-size:16px;color:var(--muted);margin:12px 0 0}
/* Lückentext */
.gaptext{font-size:22px;line-height:2.3;margin:0 0 18px;background:var(--mist);border-radius:12px;padding:12px 18px}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:130px;min-height:52px;vertical-align:middle;padding:4px 14px;margin:2px 2px;border-radius:10px;border:2px dashed var(--slate);background:var(--surface);font-size:20px;font-weight:700;line-height:1.2}
.slot.active{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.slot.filled{border-style:solid}
.slot.ok{border-color:var(--ok);background:var(--ok-bg);border-style:solid}
.slot.bad{border-color:var(--bad);background:var(--bad-bg);border-style:solid}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.word{min-height:54px;padding:8px 18px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:20px;font-weight:600}
.word:disabled{opacity:.3;cursor:default}
.bank-l{font-size:16px;color:var(--muted);margin:0 0 8px}
/* Reihenfolge */
.steps{display:grid;gap:10px}
.step{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);text-align:left;font-size:19px;line-height:1.3}
.step .no{flex:none;width:38px;height:38px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-weight:700}
.step.picked{border-color:var(--slate);background:var(--mist)}
.step.picked .no{background:var(--slate);border:0;color:#fff}
.step.ok{border-color:var(--ok);background:var(--ok-bg)}
.step.ok .no{background:var(--ok)}
.step.bad{border-color:var(--bad);background:var(--bad-bg)}
.step.bad .no{background:var(--bad)}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.row-btns .btn{flex:1 1 200px}
/* Rechnen */
.numrow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.numwrap{flex:1 1 220px;display:flex;align-items:center;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:0 16px}
.numwrap:focus-within{border-color:var(--slate)}
.numwrap input{flex:1;min-width:0;border:0;background:transparent;font-size:28px;font-weight:700;min-height:64px;outline:none}
.numwrap span{font-size:24px;font-weight:700;color:var(--muted)}
.numwrap.ok{border-color:var(--ok);background:var(--ok-bg)}
.numwrap.bad{border-color:var(--bad);background:var(--bad-bg)}
.numrow .btn{flex:0 1 180px}
.err{color:var(--bad);font-size:17px;margin:8px 0 0;min-height:1em}
/* Meinung */
.op-area{margin-top:18px}
.op-area textarea{width:100%;min-height:120px;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;font-size:19px;line-height:1.4;resize:vertical}
.op-area textarea:focus{outline:none;border-color:var(--slate)}
.op-start{font-weight:700;margin:0 0 6px}
.wc{font-size:16px;color:var(--muted);margin:6px 0 0}
.wc.okc{color:var(--ok)}
.infobox{background:var(--mist);border-left:6px solid var(--slate);border-radius:12px;padding:14px 16px;margin-top:18px;font-size:19px}
/* Feedback */
.fb{margin-top:20px;border-radius:14px;padding:16px 18px;border:2px solid;animation:fade .25s ease}
.fb.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.fb.neutral{background:var(--mist);border-color:var(--line)}
.fb-h{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;margin-bottom:6px}
.fb.ok .fb-h{color:var(--ok)}
.fb.bad .fb-h{color:var(--bad)}
.fb-h svg{width:28px;height:28px;flex:none}
.fb p{margin:6px 0}
.fb .sol{font-weight:700}
.fb .again{font-size:16px;color:var(--muted)}
.fb .bonus{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:#7a3a10;background:#fde7cf;border-radius:999px;padding:3px 12px;font-size:16px;animation:pop .6s ease}
@media (prefers-color-scheme: dark){.fb .bonus{background:#4a2c12;color:#ffd6ad}}
.fb ol{margin:6px 0;padding-left:24px}
.fb .btn{margin-top:12px}
/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 16px 20px;overflow-y:auto;animation:fade .2s ease}
.modal-in{width:100%;max-width:720px}
.modal-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;color:#fff}
.modal-bar h3{margin:0;font-size:20px}
.modal .btn.ghost{background:var(--surface);color:var(--text)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tab{min-height:48px;padding:6px 16px;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.18);color:#fff;font-size:17px;font-weight:700}
.tab[aria-selected="true"]{background:var(--surface);color:var(--text)}
/* Ergebnis */
.teacher{display:flex;align-items:center;gap:12px;background:var(--slate);color:#fff;border-radius:14px;padding:14px 18px;font-size:20px;font-weight:700;margin-bottom:16px}
.teacher svg{width:28px;height:28px;flex:none}
.res-top{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .pc{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:800;color:var(--slate)}
@media (prefers-color-scheme: dark){.ring .pc{color:#cfe0ea}}
.rank{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-weight:800;font-size:20px;padding:8px 16px;border-radius:12px;margin:4px 0 8px}
.rank svg{width:22px;height:22px}
.who{font-size:18px;color:var(--muted);margin:0}
.big{font-size:30px;font-weight:800;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:20px 0}
.stat{background:var(--mist);border-radius:12px;padding:10px 14px}
.stat b{display:block;font-size:24px}
.stat span{font-size:15px;color:var(--muted)}
.rbars{display:grid;gap:8px;margin:0 0 20px}
.rbar{display:grid;grid-template-columns:minmax(0,1fr) 80px;gap:10px;align-items:center;font-size:17px}
.rbar .bar{grid-column:1/-1;height:10px;border-radius:99px;background:var(--mist);overflow:hidden;margin-top:-4px}
.rbar .bar i{display:block;height:100%;background:var(--slate);border-radius:99px}
@media (prefers-color-scheme: dark){.rbar .bar i{background:#7fa6bf}}
.rbar .rv{text-align:right;font-weight:700}
.merks{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:m}
.merks li{counter-increment:m;display:flex;gap:12px;background:var(--merk-bg);border-radius:10px;padding:10px 14px;font-size:18px}
.merks li::before{content:counter(m);flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:grid;place-items:center;font-size:16px}
.center{text-align:center}
.bigico{width:76px;height:76px;margin:0 auto 10px;border-radius:20px;background:var(--mist);color:var(--slate);display:grid;place-items:center}
@media (prefers-color-scheme: dark){.bigico{color:#cfe0ea}}
.bigico svg{width:50px;height:50px}

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(s){
  return String(s)
    .replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, function(m, a, b){ return '<button type="button" class="term" data-def="' + esc(b) + '">' + a + '</button>'; })
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}
function plain(s){ return String(s).replace(/\[\[([^|\]]+)\|[^\]]+\]\]/g, '$1').replace(/\*\*(.+?)\*\*/g, '$1'); }
function num(n){ return String(Math.round(n * 10) / 10).replace('.', ','); }
function pts(n){ return num(n) + (n === 1 ? ' Punkt' : ' Punkte'); }
function range(n){ var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function shuffleDiff(a){ if (a.length < 2) return a.slice(); var s; var n = 0; do { s = shuffle(a); n++; } while (s.join() === a.join() && n < 30); return s; }
function derange(n){ var l = shuffle(range(n)), r, tries = 0; do { r = shuffle(range(n)); tries++; } while (r.some(function(v, i){ return v === l[i]; }) && tries < 200); return {l:l, r:r}; }
function permFor(q){
  switch (q.type){
    case 'mc': case 'case': case 'opinion':
      return {o: q.sortNum ? range(q.opts.length).sort(function(a, b){ return parseFloat(q.opts[a].replace(',', '.')) - parseFloat(q.opts[b].replace(',', '.')); }) : shuffle(range(q.opts.length))};
    case 'cat': return {o: shuffle(range(q.items.length))};
    case 'match': return derange(q.pairs.length);
    case 'gap': return {o: shuffle(range(q.answers.length + q.distract.length))};
    case 'order': return {o: shuffleDiff(range(q.steps.length))};
    default: return {};
  }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load(){ try { var s = localStorage.getItem(KEY); if (!s) return null; var o = JSON.parse(s); if (o && o.v === 1 && o.perms) return o; } catch (e) {} return null; }
function clearSave(){ try { localStorage.removeItem(KEY); } catch (e) {} }

function newGame(){
  S = {v:1, phase:'card', r:0, qi:0, perms:{}, res:{}, base:0, bonus:0, retryPts:0, streak:0, best:0, wrong:[], rq:[], ri:0, answered:false, tip:false, retries:0, started:Date.now()};
  Object.keys(ALLQ).forEach(function(id){ S.perms[id] = permFor(ALLQ[id]); });
}

function updateHeader(){
  document.getElementById('score').textContent = pts(S ? total() : 0);
  var prog = document.getElementById('prog');
  var inGame = S && (S.phase === 'card' || S.phase === 'q' || S.phase === 'intro5');
  var inRetry = S && S.phase === 'retry';
  prog.hidden = !(inGame || inRetry);
  if (prog.hidden) return;
  var segs = document.getElementById('segs');
  var t = document.getElementById('progText');
  if (inRetry){
    var done = S.ri + (S.answered ? 1 : 0);
    t.innerHTML = '<b>Nochmal-Runde</b> · Frage ' + Math.min(S.ri + 1, S.rq.length) + '/' + S.rq.length;
    segs.innerHTML = '<div class="seg" id="seg0"><i style="width:' + (done / S.rq.length * 100) + '%"></i></div>';
  } else {
    var r = ROUNDS[S.r];
    var label = S.phase === 'q' ? 'Frage ' + (S.qi + 1) + '/' + r.qs.length : (S.phase === 'card' ? 'Erinnerungskarte' : 'Start');
    t.innerHTML = '<b>Runde ' + (S.r + 1) + '/5</b> · ' + label;
    segs.innerHTML = ROUNDS.map(function(rr, i){
      var f = i < S.r ? 1 : (i === S.r && S.phase === 'q' ? (S.qi + (S.answered ? 1 : 0)) / rr.qs.length : 0);
      return '<div class="seg" id="seg' + i + '" data-fill="' + f.toFixed(3) + '"><i style="width:' + (f * 100) + '%"></i></div>';
    }).join('');
  }
  renderStreak(false);
}

}

    '<div class="stats">' +
      '<div class="stat"><b id="firstOk">' + firstOk + ' / ' + SCORED.length + '</b><span>im ersten Durchgang richtig</span></div>' +
      '<div class="stat"><b>' + num(S.bonus) + '</b><span>Serien-Bonuspunkte</span></div>' +
      '<div class="stat"><b>' + num(S.retryPts) + '</b><span>Punkte aus der Nochmal-Runde</span></div>' +
      '<div class="stat"><b>' + S.best + '</b><span>längste Serie</span></div>' +
    '</div>' +
    '<div class="rbars">' + bars + '</div>' +
    '<h2>Das solltest du dir merken</h2><ol class="merks">' + SUMMARY.map(function(m){ return '<li>' + esc(m) + '</li>'; }).join('') + '</ol>' +
    '<div class="actions">' +
      (S.wrong.length ? '<button class="btn primary" id="retry" type="button">' + I.repeat2() + 'Fehler nochmal üben (' + S.wrong.length + ')</button>' : '') +
      '<button class="btn ' + (S.wrong.length ? 'ghost' : 'primary') + '" id="restart" type="button">Neu starten</button>' +
    '</div></section>'
  );
  if (S.wrong.length) document.getElementById('retry').onclick = startRetry;
  document.getElementById('restart').onclick = function(){ clearSave(); S = null; renderStart(); updateHeader(); };
}

/* ---------- Frage-Rahmen ---------- */
function currentQ(){ return S.phase === 'retry' ? ALLQ[S.rq[S.ri]] : ROUNDS[S.r].qs[S.qi]; }

function renderQuestion(){
  var q = currentQ();
  var perm = S.perms[q.id];
  var retry = S.phase === 'retry';
  var tipCost = retry ? '−0,5' : '−1';
  var head = '<div class="qhead"><span class="qtype">' + TYPE_LABEL[q.type] + (retry ? ' · aus Runde ' + (q.round + 1) : '') + '</span><div class="tools">' +
    '<button class="tool" id="spick" type="button">' + I.card + 'Spickzettel</button>' +
    (q.type !== 'opinion' ? '<button class="tool' + (S.tip ? ' used' : '') + '" id="tipBtn" type="button"' + (S.tip ? ' disabled' : '') + '>' + I.bulb + 'Tipp (' + tipCost + ' Punkt)</button>' : '') +
    '</div></div>';
  var hint = q.hint ? '<div class="hint" id="hint"' + (S.tip ? '' : ' hidden') + '>' + I.bulb + '<span>' + fmt(q.hint) + '</span></div>' : '';
  var body = '';
  if (q.type === 'case') body += '<div class="case">' + ICON.person + '<div><b>Fall</b>' + fmt(q.scene) + '</div></div>';
  if (q.type === 'tf') body += '<p class="qtext">Richtig oder falsch?</p><div class="statement">' + fmt(q.q) + '</div>';
  else body += '<p class="qtext">' + fmt(q.q) + '</p>';
  body += '<div id="area"></div><div id="fbox"></div>';
  show('<section class="panel" data-qid="' + q.id + '" data-type="' + q.type + '">' + head + hint + body + '</section>');

  document.getElementById('spick').onclick = function(){ openSpick(retry ? q.round : (ROUNDS[S.r].card ? S.r : null)); };
  var tb = document.getElementById('tipBtn');
  if (tb) tb.onclick = function(){
    if (S.answered || S.tip) return;
    S.tip = true; save();
    tb.disabled = true; tb.classList.add('used');
    document.getElementById('hint').hidden = false;
  };
  var area = document.getElementById('area');
  RENDER[q.type](q, perm, area);
}

function lockTools(){ var tb = document.getElementById('tipBtn'); if (tb) tb.disabled = true; }

function finish(q, ok, detail){
  if (S.answered) return;
  S.answered = true;
  lockTools();
  var retry = S.phase === 'retry';
  var gained = 0, streakHit = 0;
  if (ok){
    gained = retry ? (S.tip ? 0.5 : 1) : (S.tip ? 1 : 2);
    if (retry){ S.retryPts += gained; S.wrong = S.wrong.filter(function(id){ return id !== q.id; }); }
    else {
      S.base += gained; S.streak++;
      if (S.streak > S.best) S.best = S.streak;
      if (S.streak % 3 === 0){ S.bonus += 1; streakHit = S.streak; }
    }
  } else if (!retry){
    S.streak = 0;
    if (S.wrong.indexOf(q.id) < 0) S.wrong.push(q.id);
  }
  if (!retry) S.res[q.id] = {ok:ok, tip:S.tip};
  save();
  updateHeader();
  if (streakHit) renderStreak(true);
  var h = '<div class="fb ' + (ok ? 'ok' : 'bad') + '" id="feedback" data-ok="' + ok + '" role="status">' +
    '<div class="fb-h">' + (ok ? I.ok + 'Richtig! +' + pts(gained) + (S.tip ? ' (mit Tipp)' : '') : I.bad + 'Leider falsch.') + '</div>' +
    (streakHit ? '<p><span class="bonus">' + I.bolt + streakHit + 'er-Serie! +1 Bonuspunkt</span></p>' : '') +
    (!ok && detail ? '<p class="sol">' + detail + '</p>' : '') +
    (ok && detail ? '<p>' + detail + '</p>' : '') +
    '<p>' + fmt(q.exp) + '</p>' +
    (!ok ? '<p class="again">' + (retry ? 'Diese Aufgabe bleibt in deiner Fehlerliste.' : 'Diese Aufgabe kommt am Ende in der Nochmal-Runde zurück.') + '</p>' : '') +
    '<button class="btn primary full" id="next" type="button">Weiter' + I.arrow + '</button></div>';
  showFeedback(h);
}
function showFeedback(h){
  var fbox = document.getElementById('fbox');
  fbox.innerHTML = h;
  document.getElementById('next').onclick = next;
  var fb = fbox.firstChild;
  setTimeout(function(){ try { fb.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'nearest'}); } catch (e) { fb.scrollIntoView(false); } }, 30);
}

function next(){
  if (S.phase === 'retry'){
    S.ri++;
    if (S.ri >= S.rq.length){ S.phase = 'result'; }
  } else {
    S.qi++;
    if (S.qi >= ROUNDS[S.r].qs.length){
      if (S.r < ROUNDS.length - 1){ S.r++; S.qi = 0; S.phase = ROUNDS[S.r].card ? 'card' : 'intro5'; }
      else { S.phase = S.wrong.length ? 'retryintro' : 'result'; }
    }
  }
  S.answered = false; S.tip = false;
  save(); route();
}

function route(){
  if (!S){ renderStart(); return; }
  switch (S.phase){
    case 'card': renderCard(); break;
    case 'intro5': renderIntro5(); break;
    case 'q': case 'retry': renderQuestion(); break;
    case 'retryintro': renderRetryIntro(); break;
    case 'result': renderResult(); break;
    default: renderStart();
  }
}

/* ---------- Aufgabentypen ---------- */
var LET = 'ABCD';
var RENDER = {};
RENDER.mc = function(q, perm, area){
  area.innerHTML = '<div class="opts">' + perm.o.map(function(oi, k){
    return '<button class="opt" type="button" data-i="' + oi + '"><span class="lt">' + LET[k] + '</span><span>' + esc(q.opts[oi]) + '</span></button>';
  }).join('') + '</div>';
  area.querySelectorAll('.opt').forEach(function(b){
    b.onclick = function(){
      if (S.answered) return;
      var i = +b.getAttribute('data-i'), ok = i === q.c;
      area.querySelectorAll('.opt').forEach(function(x){
        x.disabled = true;
        var xi = +x.getAttribute('data-i');
        if (xi === q.c) x.classList.add('ok'); else if (x === b) x.classList.add('bad'); else x.classList.add('dim');
      });
      finish(q, ok, ok ? '' : 'Richtig ist: ' + esc(q.opts[q.c]));
    };
  });
};
RENDER['case'] = RENDER.mc;
RENDER.tf = function(q, perm, area){
  area.innerHTML = '<div class="tf"><button class="opt" type="button" data-v="1">Richtig</button><button class="opt" type="button" data-v="0">Falsch</button></div>';
  area.querySelectorAll('.opt').forEach(function(b){
    b.onclick = function(){
      if (S.answered) return;
      var v = b.getAttribute('data-v') === '1', ok = v === q.a;
      area.querySelectorAll('.opt').forEach(function(x){
        x.disabled = true;
        var xv = x.getAttribute('data-v') === '1';
        if (xv === q.a) x.classList.add('ok'); else x.classList.add('bad');
      });
      finish(q, ok, ok ? '' : 'Die Aussage ist ' + (q.a ? 'richtig' : 'falsch') + '.');
    };
  });
};
RENDER.cat = function(q, perm, area){
  var k = 0, right = 0;
  area.innerHTML = '<div class="cat-now" id="catNow"></div>' +
    '<div class="cat-btns" id="catBtns">' + q.cats.map(function(c, i){ return '<button class="opt" type="button" data-cat="' + i + '">' + esc(c) + '</button>'; }).join('') + '</div>' +
    '<div class="bins">' + q.cats.map(function(c, i){ return '<div class="bin"><h4>' + esc(c) + '</h4><ul id="bin' + i + '"></ul></div>'; }).join('') + '</div>';
  var now = document.getElementById('catNow');
  function drawNow(){
    if (k < perm.o.length){
      var it = q.items[perm.o[k]];
      now.innerHTML = '<small>Begriff ' + (k + 1) + ' von ' + perm.o.length + '</small><span class="cat-item" id="catItem" data-item="' + perm.o[k] + '">' + esc(it[0]) + '</span>';
    }
  }
  drawNow();
  area.querySelectorAll('[data-cat]').forEach(function(b){
    b.onclick = function(){
      if (S.answered || k >= perm.o.length) return;
      var chosen = +b.getAttribute('data-cat');
      var it = q.items[perm.o[k]];
      var ok = chosen === it[1];
      if (ok) right++;
      var li = document.createElement('li');
      li.textContent = it[0];
      if (!ok){ li.className = 'bad'; var sm = document.createElement('small'); sm.textContent = 'Du hattest: ' + q.cats[chosen]; li.appendChild(sm); }
      document.getElementById('bin' + it[1]).appendChild(li);
      k++;
      if (k >= perm.o.length){
        now.innerHTML = '';
        document.getElementById('catBtns').hidden = true;
        var all = right === perm.o.length;
        finish(q, all, right + ' von ' + perm.o.length + ' Begriffen richtig einsortiert.' + (all ? '' : ' Die roten Begriffe stehen jetzt in der richtigen Spalte.'));
      } else drawNow();
    };
  });
};
RENDER.match = function(q, perm, area){
  var selL = null, selR = null, mistakes = 0, done = 0, busy = false;
  area.innerHTML = '<div class="match"><div class="mcol"><h4>Begriff</h4>' +
    perm.l.map(function(i){ return '<button class="mi left" type="button" data-l="' + i + '">' + esc(q.pairs[i][0]) + '</button>'; }).join('') +
    '</div><div class="mcol"><h4>Erklärung</h4>' +
    perm.r.map(function(i){ return '<button class="mi right" type="button" data-r="' + i + '">' + esc(q.pairs[i][1]) + '</button>'; }).join('') +
    '</div></div><p class="mstat" id="mstat">0 von ' + q.pairs.length + ' Paaren gefunden</p>';
  var L = function(i){ return area.querySelector('[data-l="' + i + '"]'); };
  var R = function(i){ return area.querySelector('[data-r="' + i + '"]'); };
  function check(){
    if (selL === null || selR === null) return;
    var a = L(selL), b = R(selR);
    if (selL === selR){
      done++;
      [a, b].forEach(function(x){ x.classList.remove('sel'); x.classList.add('done'); x.disabled = true; x.insertAdjacentHTML('beforeend', '<span class="pn">' + done + '</span>'); });
      selL = selR = null;
      document.getElementById('mstat').textContent = done + ' von ' + q.pairs.length + ' Paaren gefunden' + (mistakes ? ' · ' + mistakes + ' Fehlversuch' + (mistakes > 1 ? 'e' : '') : '');
      if (done === q.pairs.length){
        finish(q, mistakes === 0, mistakes === 0 ? 'Alle Paare beim ersten Versuch richtig.' : 'Du hattest ' + mistakes + ' Fehlversuch' + (mistakes > 1 ? 'e' : '') + '. Die richtigen Paare sind jetzt grün markiert.');
      }
    } else {
      mistakes++; busy = true;
      [a, b].forEach(function(x){ x.classList.remove('sel'); x.classList.add('wrong'); });
      document.getElementById('mstat').textContent = done + ' von ' + q.pairs.length + ' Paaren gefunden · ' + mistakes + ' Fehlversuch' + (mistakes > 1 ? 'e' : '');
      setTimeout(function(){ a.classList.remove('wrong'); b.classList.remove('wrong'); busy = false; }, 650);
      selL = selR = null;
    }
  }
  area.querySelectorAll('.mi').forEach(function(btn){
    btn.onclick = function(){
      if (S.answered || busy || btn.classList.contains('done')) return;
      if (btn.hasAttribute('data-l')){
        var i = +btn.getAttribute('data-l');
        if (selL !== null) L(selL).classList.remove('sel');
        selL = (selL === i) ? null : i;
        if (selL !== null) btn.classList.add('sel');
      } else {
        var j = +btn.getAttribute('data-r');
        if (selR !== null) R(selR).classList.remove('sel');
        selR = (selR === j) ? null : j;
        if (selR !== null) btn.classList.add('sel');
      }
      check();
    };
  });
};
RENDER.gap = function(q, perm, area){
  var words = q.answers.concat(q.distract);
  var n = q.answers.length;
  var fills = []; for (var i = 0; i < n; i++) fills.push(null);
  var active = 0;
  var txt = esc(q.text).replace(/\{(\d)\}/g, function(m, d){ return '<button class="slot" type="button" data-s="' + d + '" aria-label="Lücke ' + (+d + 1) + '">&nbsp;</button>'; });
  area.innerHTML = '<div class="gaptext">' + txt + '</div><p class="bank-l">Tippe ein Wort an. Tippe eine gefüllte Lücke an, um sie wieder zu leeren.</p>' +
    '<div class="bank">' + perm.o.map(function(w){ return '<button class="word" type="button" data-w="' + w + '">' + esc(words[w]) + '</button>'; }).join('') + '</div>' +
    '<div class="row-btns"><button class="btn primary" id="check" type="button" disabled>Prüfen</button></div>';
  var check = document.getElementById('check');
  function draw(){
    area.querySelectorAll('.slot').forEach(function(s){
      var k = +s.getAttribute('data-s');
      s.innerHTML = fills[k] === null ? '&nbsp;' : esc(words[fills[k]]);
      s.classList.toggle('filled', fills[k] !== null);
      s.classList.toggle('active', k === active && !S.answered);
    });
    area.querySelectorAll('.word').forEach(function(w){ w.disabled = S.answered || fills.indexOf(+w.getAttribute('data-w')) >= 0; });
    check.disabled = S.answered || fills.indexOf(null) >= 0;
  }
  function nextEmpty(from){ for (var i = 0; i < n; i++){ var k = (from + i) % n; if (fills[k] === null) return k; } return -1; }
  area.querySelectorAll('.word').forEach(function(w){
    w.onclick = function(){
      if (S.answered) return;
      var t = fills[active] === null ? active : nextEmpty(active);
      if (t < 0) return;
      fills[t] = +w.getAttribute('data-w');
      var ne = nextEmpty(t);
      active = ne < 0 ? t : ne;
      draw();
    };
  });
  area.querySelectorAll('.slot').forEach(function(s){
    s.onclick = function(){
      if (S.answered) return;
      var k = +s.getAttribute('data-s');
      fills[k] = null; active = k; draw();
    };
  });
  check.onclick = function(){
    if (S.answered || fills.indexOf(null) >= 0) return;
    var ok = true;
    area.querySelectorAll('.slot').forEach(function(s){
      var k = +s.getAttribute('data-s');
      var good = fills[k] === k;
      if (!good) ok = false;
      s.classList.add(good ? 'ok' : 'bad');
      s.disabled = true;
    });
    finish(q, ok, ok ? '' : 'Richtig ist: ' + q.answers.map(function(a, i){ return (i + 1) + '. ' + esc(a); }).join(' · '));
    draw();
  };
  draw();
};
RENDER.order = function(q, perm, area){
  var picked = [];
  area.innerHTML = '<p class="bank-l">Tippe zuerst den ersten Schritt an, dann den zweiten und so weiter. Tippe die letzte Nummer noch einmal an, um sie zurückzunehmen.</p>' +
    '<div class="steps">' + perm.o.map(function(i){ return '<button class="step" type="button" data-step="' + i + '"><span class="no"></span><span>' + esc(q.steps[i]) + '</span></button>'; }).join('') + '</div>' +
    '<div class="row-btns"><button class="btn ghost" id="reset" type="button">Zurücksetzen</button><button class="btn primary" id="check" type="button" disabled>Prüfen</button></div>';
  var check = document.getElementById('check');
  function draw(){
    area.querySelectorAll('.step').forEach(function(b){
      var i = +b.getAttribute('data-step'); var pos = picked.indexOf(i);
      b.classList.toggle('picked', pos >= 0);
      b.querySelector('.no').textContent = pos >= 0 ? (pos + 1) : '';
    });
    check.disabled = S.answered || picked.length < q.steps.length;
  }
  area.querySelectorAll('.step').forEach(function(b){
    b.onclick = function(){
      if (S.answered) return;
      var i = +b.getAttribute('data-step'); var pos = picked.indexOf(i);
      if (pos < 0) picked.push(i); else if (pos === picked.length - 1) picked.pop();
      draw();
    };
  });
  document.getElementById('reset').onclick = function(){ if (S.answered) return; picked = []; draw(); };
  check.onclick = function(){
    if (S.answered || picked.length < q.steps.length) return;
    var ok = picked.every(function(v, k){ return v === k; });
    area.querySelectorAll('.step').forEach(function(b){
      var i = +b.getAttribute('data-step');
      b.classList.add(picked.indexOf(i) === i ? 'ok' : 'bad'); b.disabled = true;
    });
    document.getElementById('reset').disabled = true;
    finish(q, ok, ok ? '' : 'Richtige Reihenfolge:<ol>' + q.steps.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>');
    draw();
  };
  draw();
};
function parseNum(s){
  s = String(s).replace(/€|\s/g, '');
  if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(',', '.');
  if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}
RENDER.num = function(q, perm, area){
  area.innerHTML = '<div class="numrow"><label class="numwrap" id="numWrap"><span class="sr">Deine Antwort</span><input id="numIn" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Zahl eingeben" enterkeyhint="done">' + (q.unit ? '<span>' + esc(q.unit) + '</span>' : '') + '</label>' +
    '<button class="btn primary" id="check" type="button">Prüfen</button></div><p class="err" id="err" aria-live="polite"></p>';
  var inp = document.getElementById('numIn');
  function go(){
    if (S.answered) return;
    var v = parseNum(inp.value);
    if (isNaN(v)){ document.getElementById('err').textContent = 'Bitte gib eine Zahl ein, zum Beispiel 12,5.'; return; }
    document.getElementById('err').textContent = '';
    var ok = Math.abs(v - q.a) < 0.005;
    inp.readOnly = true; inp.blur();
    document.getElementById('numWrap').classList.add(ok ? 'ok' : 'bad');
    document.getElementById('check').disabled = true;
    finish(q, ok, ok ? '' : 'Richtig ist: ' + num(q.a) + (q.unit ? ' ' + q.unit : '') + '.');
  }
  document.getElementById('check').onclick = go;
  inp.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); go(); } });
};
RENDER.opinion = function(q, perm, area){
  var choice = null;
  area.innerHTML = '<p class="bank-l">Hier gibt es kein Richtig oder Falsch und keine Punkte. Deine Meinung zählt.</p><div class="opts">' + perm.o.map(function(oi, k){
    return '<button class="opt" type="button" data-i="' + oi + '"><span class="lt">' + LET[k] + '</span><span>' + esc(q.opts[oi]) + '</span></button>';
  }).join('') + '</div><div id="opArea"></div>';
  area.querySelectorAll('.opt').forEach(function(b){
    b.onclick = function(){
      if (S.answered) return;
      choice = +b.getAttribute('data-i');
      area.querySelectorAll('.opt').forEach(function(x){ x.classList.toggle('sel', x === b); });
      var op = document.getElementById('opArea');
      if (!op.innerHTML){
        op.innerHTML = '<div class="op-area"><p class="op-start">Ich finde das am fairsten, weil …</p>' +
          '<textarea id="opText" aria-label="Deine Begründung" placeholder="… schreib hier weiter (mindestens 5 Wörter)"></textarea>' +
          '<p class="wc" id="wc">0 von 5 Wörtern</p>' +
          '<div class="row-btns"><button class="btn primary" id="opDone" type="button" disabled>Fertig</button></div></div>';
        var ta = document.getElementById('opText'), wc = document.getElementById('wc'), done = document.getElementById('opDone');
        ta.addEventListener('input', function(){
          var n = ta.value.trim() ? ta.value.trim().split(/\s+/).filter(function(w){ return /[A-Za-zÄÖÜäöüß0-9]/.test(w); }).length : 0;
          wc.textContent = n + ' von 5 Wörtern' + (n >= 5 ? ' – gut!' : '');
          wc.classList.toggle('okc', n >= 5);
          done.disabled = n < 5;
        });
        done.onclick = function(){
          if (S.answered || done.disabled || choice === null) return;
          S.answered = true; save(); updateHeader();
          ta.readOnly = true; done.disabled = true;
          area.querySelectorAll('.opt').forEach(function(x){ x.disabled = true; });
          showFeedback('<div class="fb neutral" id="feedback" data-ok="opinion" role="status"><div class="fb-h">Danke für deine Meinung!</div><p>' + esc(q.info) + '</p><button class="btn primary full" id="next" type="button">Weiter' + I.arrow + '</button></div>');
        };
      }
    };
  });
};

/* ---------- Start ---------- */
var saved = load();
if (saved) S = null;
renderStart();
updateHeader();
})();
</script>
